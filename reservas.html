<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservas | Hotel Paradise</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="container">

            <a href="index.html" class="logo">
                Hotel <span>Paradise</span>
            </a>

            <nav>

                <ul>

                    <li>
                        <a href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a href="habitaciones.html">
                            Habitaciones
                        </a>
                    </li>

                    <li>
                        <a href="reservas.html" class="active">
                            Reservas
                        </a>
                    </li>

                    <li>
                        <a href="contacto.html">
                            Contacto
                        </a>
                    </li>

                    <li>
                        <a href="login.html">
                            Iniciar Sesión
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- =========================
         RESERVAS
    ========================== -->

    <main class="booking">

        <div class="container">

            <div class="section-title">

                <h2>Reserva tu Habitación</h2>

                <p>
                    Completa el formulario para reservar
                    tu estancia en Hotel Paradise.
                </p>

            </div>


            <div class="form-container">

                <!--
                    Al confirmar la reserva,
                    el usuario será enviado
                    a reserva-realizada.html
                -->

                <form
                    action="reserva-realizada.html"
                    method="get">


                    <div class="form-grid">


                        <!-- NOMBRE -->

                        <div class="input-group">

                            <label for="nombre">
                                Nombre Completo
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                placeholder="Ingrese su nombre completo"
                                required>

                        </div>


                        <!-- CORREO -->

                        <div class="input-group">

                            <label for="correo">
                                Correo Electrónico
                            </label>

                            <input
                                type="email"
                                id="correo"
                                name="correo"
                                placeholder="ejemplo@correo.com"
                                required>

                        </div>


                        <!-- TELÉFONO -->

                        <div class="input-group">

                            <label for="telefono">
                                Teléfono
                            </label>

                            <input
                                type="tel"
                                id="telefono"
                                name="telefono"
                                placeholder="0000-0000"
                                required>

                        </div>


                        <!-- HABITACIÓN -->

                        <div class="input-group">

                            <label for="habitacion">
                                Tipo de Habitación
                            </label>

                            <select
                                id="habitacion"
                                name="habitacion"
                                required>

                                <option value="">
                                    Seleccione una habitación
                                </option>

                                <option value="Deluxe">
                                    Habitación Deluxe
                                </option>

                                <option value="Premium">
                                    Habitación Premium
                                </option>

                                <option value="Ejecutiva">
                                    Suite Ejecutiva
                                </option>

                                <option value="Familiar">
                                    Habitación Familiar
                                </option>

                                <option value="Luna de Miel">
                                    Suite Luna de Miel
                                </option>

                                <option value="Presidencial">
                                    Suite Presidencial
                                </option>

                            </select>

                        </div>


                        <!-- FECHA DE ENTRADA -->

                        <div class="input-group">

                            <label for="entrada">
                                Fecha de Entrada
                            </label>

                            <input
                                type="date"
                                id="entrada"
                                name="entrada"
                                required>

                        </div>


                        <!-- FECHA DE SALIDA -->

                        <div class="input-group">

                            <label for="salida">
                                Fecha de Salida
                            </label>

                            <input
                                type="date"
                                id="salida"
                                name="salida"
                                required>

                        </div>


                        <!-- ADULTOS -->

                        <div class="input-group">

                            <label for="adultos">
                                Número de Adultos
                            </label>

                            <input
                                type="number"
                                id="adultos"
                                name="adultos"
                                min="1"
                                max="6"
                                value="1"
                                required>

                        </div>


                        <!-- NIÑOS -->

                        <div class="input-group">

                            <label for="ninos">
                                Número de Niños
                            </label>

                            <input
                                type="number"
                                id="ninos"
                                name="ninos"
                                min="0"
                                max="6"
                                value="0">

                        </div>


                        <!-- SOLICITUDES -->

                        <div class="input-group full">

                            <label for="solicitudes">
                                Solicitudes Especiales
                            </label>

                            <textarea
                                id="solicitudes"
                                name="solicitudes"
                                placeholder="Escriba alguna solicitud especial...">
                            </textarea>

                        </div>


                        <!-- BOTÓN -->

                        <div class="input-group full">

                            <button
                                type="submit"
                                class="btn">

                                Confirmar Reserva

                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="container">

            <p>
                © 2026 Hotel Paradise |
                Todos los derechos reservados.
            </p>

        </div>

    </footer>

</body>

</html>
